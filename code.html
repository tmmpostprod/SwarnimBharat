<!DOCTYPE html><html lang="hi" style="background-color: rgb(243, 239, 230); opacity: 0;" data-stitch-anim-opacity="true"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Swarnim Bharat Udayghosh - Coming Soon</title>
<!-- Google Fonts for High-Fidelity Typography -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&amp;family=Cormorant+Garamond:wght@600;700&amp;family=Marcellus&amp;family=Noto+Sans+Devanagari:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pageBg: '#f8f5ee',
            primaryNavy: '#132c4d',
            subHindiBlue: '#154f85',
            accentGold: '#b8893d',
            accentOrange: '#bf541e',
            borderCream: '#e4ddd0',
            textMuted: '#6d7582'
          },
          fontFamily: {
            serifHeading: ['"Playfair Display"', 'Georgia', 'serif'],
            cinzel: ['"Cinzel"', 'serif'],
            marcellus: ['"Marcellus"', 'serif'],
            devanagari: ['"Noto Sans Devanagari"', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>
<!-- Custom Styles for Typography & Banner Framing -->
<style data-purpose="layout-and-visual-effects">
    body {
      background-color: #f8f5ee;
      color: #132c4d;
      margin: 0;
      padding: 0;
    }

    /* Gold gradient text for Udayghosh */
    .gold-gradient-text {
      background: linear-gradient(135deg, #a4762b 0%, #c89c4c 50%, #996e27 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Thin ornamental divider rule */
    .ornamental-divider {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .ornamental-divider::before,
    .ornamental-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, #cbb58d, #cbb58d, transparent);
      max-width: 440px;
    }

    .ornamental-divider::before {
      background: linear-gradient(to left, #cfba94 0%, transparent 100%);
    }

    .ornamental-divider::after {
      background: linear-gradient(to right, #cfba94 0%, transparent 100%);
    }

    /* Countdown Card styling for soft bevel and subtle border */
    .countdown-card {
      background: #ffffff;
      border: 1px solid #ebe4d8;
      box-shadow: 0 4px 14px -2px rgba(189, 175, 150, 0.2);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans select-none antialiased bg-[#f8f5ee]" style="background-color: rgb(243, 239, 230);">
<!-- BEGIN: MainHeaderGraphic -->
<!-- Top Banner displaying the monumental panoramic heritage visual cropped as in reference -->
<header class="w-full relative overflow-hidden bg-[#f8f5ee]" data-purpose="hero-banner" style="background-color: rgb(243, 239, 230);">
<div class="w-full relative max-h-[445px] sm:max-h-[485px] md:max-h-[515px] lg:max-h-[545px] overflow-hidden">
<!-- 
        The provided composite reference image contains the entire hero illustration 
        (Vivekananda Rock Memorial, Thiruvalluvar Statue, Golden Victory Trophy, India Gate, and the Tricolor swishes).
        We display it framed to the visual header section.
      -->
<img alt="Swarnim Bharat Udayghosh - National Heritage and Monuments" class="w-full h-auto object-cover object-top block" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCEnMRLYqzhITH53bFQtK8IoRPtAsdADU_PPtN28VgkIWZWQNYRwc3zGEpeJ-Oqr3XhwwBrrXNW5c06pUoZBwHFK3dPTh3a4VfbLYIZs9mcJ0eIpgusDrOHTneSYDZtWzLAFbJ34k_0w5r4m4-F1CCSxmQuQ_zs-Wqbx9RAZ72yIhHGxwRJA8mDZhlijHYlOAQHFX2KjtT4TNgHyPtW_TgE-uNGJ3pmTOHNFmPbAkhrMbQWe92tEJoY" style="max-height: 520px; min-height: 290px;">
</div>
</header>
<!-- END: MainHeaderGraphic -->
<!-- BEGIN: MainContent -->
<main class="w-full flex-grow flex flex-col items-center justify-start px-4 pt-6 pb-20 max-w-7xl mx-auto" data-purpose="landing-content">
<!-- Primary Title Section -->
<section class="text-center w-full max-w-4xl px-2" data-purpose="main-headings">
<h1 class="font-serifHeading font-bold tracking-tight text-3xl sm:text-5xl md:text-6xl text-[#122b49] leading-tight">
<span class="">Swarnim Bharat</span>
<span class="gold-gradient-text ml-1 sm:ml-2 font-serifHeading font-semibold">Udayghosh</span>
</h1>
<!-- Hindi Inspirational Subheading -->
<p class="font-devanagari font-semibold text-[#18538a] text-base sm:text-lg md:text-[1.32rem] mt-3 tracking-wide">
        मैं भी भारत, तुम भी भारत <span class="font-light mx-1">—</span> मेरा देश, मेरी ज़िम्मेदारी
      </p>
<!-- National Journey Subtitle -->
<p class="text-[#3b4b5e] text-xs sm:text-sm md:text-[0.95rem] tracking-wide mt-2 font-medium">
        A 21-year national journey &nbsp;·&nbsp; 2026 → 2047 &nbsp;·&nbsp; Towards a Viksit Bharat
      </p>
<!-- Decorative Divider with Center Text -->
<div class="ornamental-divider mt-5 sm:mt-6 mb-8 sm:mb-10 px-2" data-purpose="section-divider">
<span class="px-4 text-xs sm:text-sm font-devanagari font-medium text-[#132c4d] tracking-wide whitespace-nowrap">
          एक पहल &nbsp;·&nbsp; एक संकल्प &nbsp;·&nbsp; स्वर्णिम भारत
        </span>
</div>
<!-- Prominent Status Announcement -->
<h2 class="font-serifHeading font-bold text-3xl sm:text-4xl md:text-5xl text-[#122b49] tracking-wider mb-8 sm:mb-10" data-purpose="status-title">
        COMING SOON...
      </h2>
</section>
<!-- BEGIN: CountdownTimer -->
<!-- 4 Structured Countdown Metric Cards -->
<section class="w-full max-w-3xl px-2" data-purpose="countdown-container">
<div class="grid grid-cols-4 gap-3 sm:gap-5 md:gap-6">
<!-- Days Card -->
<article class="countdown-card rounded-xl sm:rounded-2xl py-4 sm:py-6 px-1 sm:px-4 text-center flex flex-col items-center justify-center transition-transform hover:-translate-y-0.5 duration-200" data-purpose="metric-days">
<span class="font-sans font-bold text-2xl sm:text-4xl md:text-5xl text-[#112338] tracking-tight leading-none mb-1.5 sm:mb-2">
            48
          </span>
<span class="text-[9px] sm:text-xs md:text-sm font-semibold tracking-widest text-[#727a87] uppercase">
            DAYS
          </span>
</article>
<!-- Hours Card -->
<article class="countdown-card rounded-xl sm:rounded-2xl py-4 sm:py-6 px-1 sm:px-4 text-center flex flex-col items-center justify-center transition-transform hover:-translate-y-0.5 duration-200" data-purpose="metric-hours">
<span class="font-sans font-bold text-2xl sm:text-4xl md:text-5xl text-[#112338] tracking-tight leading-none mb-1.5 sm:mb-2">
            14
          </span>
<span class="text-[9px] sm:text-xs md:text-sm font-semibold tracking-widest text-[#727a87] uppercase">
            HOURS
          </span>
</article>
<!-- Minutes Card -->
<article class="countdown-card rounded-xl sm:rounded-2xl py-4 sm:py-6 px-1 sm:px-4 text-center flex flex-col items-center justify-center transition-transform hover:-translate-y-0.5 duration-200" data-purpose="metric-minutes">
<span class="font-sans font-bold text-2xl sm:text-4xl md:text-5xl text-[#112338] tracking-tight leading-none mb-1.5 sm:mb-2">
            26
          </span>
<span class="text-[9px] sm:text-xs md:text-sm font-semibold tracking-widest text-[#727a87] uppercase">
            MINUTES
          </span>
</article>
<!-- Seconds Card (Special Orange Accent) -->
<article class="countdown-card rounded-xl sm:rounded-2xl py-4 sm:py-6 px-1 sm:px-4 text-center flex flex-col items-center justify-center transition-transform hover:-translate-y-0.5 duration-200" data-purpose="metric-seconds">
<span class="font-sans font-bold text-2xl sm:text-4xl md:text-5xl text-[#bf541e] tracking-tight leading-none mb-1.5 sm:mb-2">
            03
          </span>
<span class="text-[9px] sm:text-xs md:text-sm font-semibold tracking-widest text-[#727a87] uppercase">
            SECONDS
          </span>
</article>
</div>
</section>
<!-- END: CountdownTimer -->
</main>
<!-- END: MainContent -->




</body></html>
